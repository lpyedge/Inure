<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticket detail</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif;color:#1d2330;background:#fff}
h1{font-size:17px;margin:0 0 12px}
section{margin:0 0 16px}
.label{display:block;font-size:12px;color:#526;margin:0 0 3px}
#history{height:280px;overflow:auto;border:1px solid #d8dee9;background:#fbfcfe;padding:8px 10px}
.msg{margin:0 0 8px;padding:6px 8px;border-radius:4px;background:#fff;border:1px solid #e6eaf1}
.msg.agent{background:#eef3fb}
.who{font-weight:600;margin-right:6px}
input,select,textarea,button{font:inherit}
select,textarea{padding:5px 7px;border:1px solid #b8c0cc;border-radius:3px;background:#fff}
textarea{width:100%;min-height:64px}
button{padding:6px 12px;border:1px solid #b8c0cc;border-radius:3px;background:#fff;cursor:pointer}
#reply{min-height:70px;border:1px solid #b8c0cc;border-radius:3px;padding:7px;background:#fff}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin:0 0 10px}
#date-popup{position:absolute;z-index:20;background:#fff;border:1px solid #9aa6bb;border-radius:4px;padding:10px;box-shadow:0 8px 22px rgba(20,28,45,.25);width:280px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:0 0 8px}
.cal-head h3{font-size:15px;margin:0}
#day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
#day-grid button{padding:4px 0;text-align:center}
#saved{margin:8px 0 0;font-weight:600;color:#1f7a3f;min-height:1.2em}
#followup-wrap{position:relative;display:inline-block}
</style></head>
<body>
<h1><span id="ticket-id"></span> — <span id="ticket-subject"></span></h1>

<section aria-label="Message history section">
  <h2 class="label">Message history</h2>
  <div id="history" role="log" aria-label="Message history" tabindex="0"></div>
</section>

<section aria-label="Ticket fields">
  <div class="row">
    <div>
      <span class="label">Priority</span>
      <priority-picker id="priority"></priority-picker>
    </div>
    <div>
      <label class="label" for="status">Status</label>
      <select id="status">
        <option>Open</option>
        <option>Pending</option>
        <option>Resolved</option>
      </select>
    </div>
    <div>
      <label class="label" for="assignee">Assignee</label>
      <select id="assignee">
        <option>Avery Cole</option>
        <option>Bao Tran</option>
        <option>Casey Moore</option>
        <option>Dana Ruiz</option>
        <option>Eli Novak</option>
        <option>Farah Aziz</option>
      </select>
    </div>
    <div id="followup-wrap">
      <div><button id="followup-btn" type="button">Follow-up date: not set</button></div>
      <div id="date-popup" role="dialog" aria-label="Choose date" hidden>
        <div class="cal-head">
          <button id="prev-month" type="button">Previous month</button>
          <h3 id="month-label"></h3>
          <button id="next-month" type="button">Next month</button>
        </div>
        <div id="day-grid"></div>
      </div>
    </div>
  </div>
</section>

<section aria-label="Reply">
  <span class="label">Reply</span>
  <div id="reply" contenteditable="true" role="textbox" aria-label="Reply"></div>
  <p><button id="send-reply" type="button">Send</button></p>
</section>

<section aria-label="Internal note">
  <label class="label" for="note">Internal note</label>
  <textarea id="note" aria-label="Internal note"></textarea>
  <p><button id="send-note" type="button">Send</button></p>
</section>

<p><button id="save" type="button">Save changes</button></p>
<p id="saved" role="status"></p>

<script>
const q = new URLSearchParams(location.search);
const arm = q.get('arm') || 'x';
const seed = q.get('seed') || '';
const ticketId = q.get('ticket') || '';
const $ = id => document.getElementById(id);
const ev = v => fetch('/event?arm=' + encodeURIComponent(arm) + '&v=' + encodeURIComponent(v), {method: 'POST'}).catch(() => {});

const PRIORITIES = ['Low', 'Normal', 'High', 'Urgent'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December'];

class PriorityPicker extends HTMLElement {
  constructor() {
    super();
    const root = this.attachShadow({mode: 'open'});
    const style = document.createElement('style');
    style.textContent = 'div{display:flex;flex-wrap:wrap;gap:8px}label{display:inline-flex;align-items:center;gap:3px}';
    const group = document.createElement('div');
    group.setAttribute('role', 'radiogroup');
    group.setAttribute('aria-label', 'Priority');
    this._inputs = {};
    for (const p of PRIORITIES) {
      const id = 'prio-' + p.toLowerCase();
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'priority';
      input.id = id;
      input.value = p;
      input.checked = p === 'Normal';
      const label = document.createElement('label');
      label.htmlFor = id;
      label.textContent = p;
      group.append(input, label);
      this._inputs[p] = input;
    }
    root.append(style, group);
  }

  get value() {
    for (const p of PRIORITIES) {
      if (this._inputs && this._inputs[p] && this._inputs[p].checked) return p;
    }
    return 'Normal';
  }

  set value(v) {
    if (!this._inputs) return;
    for (const p of PRIORITIES) this._inputs[p].checked = p === v;
  }
}
customElements.define('priority-picker', PriorityPicker);

let ticket = null;
let lastReply = '';
let selectedDate = '';
let calYear = 2026;
let calMonth = 2;

function daysInMonth(year, month) {
  if (month === 1) {
    return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0 ? 29 : 28;
  }
  return [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month];
}

function renderCalendar() {
  $('month-label').textContent = MONTHS[calMonth] + ' ' + calYear;
  const grid = $('day-grid');
  grid.textContent = '';
  const total = daysInMonth(calYear, calMonth);
  for (let d = 1; d <= total; d++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = String(d);
    b.setAttribute('aria-label', MONTHS[calMonth] + ' ' + d + ', ' + calYear);
    b.addEventListener('click', () => {
      selectedDate = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      $('followup-btn').textContent = 'Follow-up date: ' + selectedDate;
      $('date-popup').hidden = true;
    });
    grid.appendChild(b);
  }
}

$('followup-btn').addEventListener('click', () => {
  const popup = $('date-popup');
  popup.hidden = !popup.hidden;
  if (!popup.hidden) renderCalendar();
});
$('prev-month').addEventListener('click', () => {
  calMonth -= 1;
  if (calMonth < 0) { calMonth = 11; calYear -= 1; }
  renderCalendar();
});
$('next-month').addEventListener('click', () => {
  calMonth += 1;
  if (calMonth > 11) { calMonth = 0; calYear += 1; }
  renderCalendar();
});

function renderMessages() {
  const box = $('history');
  box.textContent = '';
  for (const m of ticket.messages) {
    const div = document.createElement('div');
    div.className = 'msg ' + m.from;
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = m.from;
    const text = document.createElement('span');
    text.textContent = m.text;
    div.append(who, text);
    box.appendChild(div);
  }
}

$('send-reply').addEventListener('click', () => {
  const text = $('reply').textContent.trim();
  if (!text) return;
  lastReply = text;
  ev('reply-sent:' + ticketId);
  const box = $('history');
  const div = document.createElement('div');
  div.className = 'msg agent';
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = 'agent (you)';
  const body = document.createElement('span');
  body.textContent = text;
  div.append(who, body);
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  $('reply').textContent = '';
});
$('send-note').addEventListener('click', () => {
  ev('note-sent:' + ticketId);
});

$('save').addEventListener('click', async () => {
  const body = {
    ticket: ticketId,
    priority: $('priority').value,
    assignee: $('assignee').value,
    followup: selectedDate || '',
    status: $('status').value,
    reply: lastReply || ''
  };
  try {
    await fetch('/submit?arm=' + encodeURIComponent(arm), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
  } catch (e) {}
  let code = '';
  try {
    const res = await fetch('/code?arm=' + encodeURIComponent(arm));
    const j = await res.json();
    if (j && j.code !== undefined) code = String(j.code);
  } catch (e) {}
  $('saved').textContent = 'Saved';
  window.parent.postMessage({type: 'saved', code: code}, location.origin);
});

async function boot() {
  try {
    const res = await fetch('data/tix_' + encodeURIComponent(seed) + '.json');
    if (res.ok) {
      const d = await res.json();
      const list = Array.isArray(d.tickets) ? d.tickets : [];
      ticket = list.find(t => t.id === ticketId) || null;
    }
  } catch (e) {}
  if (ticket) {
    $('ticket-id').textContent = ticket.id;
    $('ticket-subject').textContent = ticket.subject;
    renderMessages();
  }
}

boot().then(() => { window.__ready = true; });
</script>
</body></html>
