<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>登录</title>
<style>body{font:16px sans-serif;margin:40px}label{display:block;margin:12px 0}</style></head>
<body>
<h1>示例登录</h1>
<form onsubmit="return false">
  <label>用户名 <input id="user" name="user" autocomplete="off"></label>
  <label>密码 <input id="pass" name="pass" type="password" autocomplete="off"></label>
  <button id="login" type="button">登录</button>
</form>
<p id="status" aria-live="polite"></p>
<script>
document.getElementById('login').addEventListener('click', () => {
  const u = document.getElementById('user').value;
  const p = document.getElementById('pass').value;
  const el = document.getElementById('status');
  if (u && p === 'hunter2') { el.id = 'welcome'; el.textContent = '欢迎 ' + u; }
  else { el.textContent = '用户名或密码错误'; }
});
</script>
</body></html>
