[package]
name = "rig-eval"
description = "感知层评估框架：任务定义、指标汇总、泄密检测。回答'语义化输出是否真的比直接发截图更好'。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
rig-proto.workspace = true
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
