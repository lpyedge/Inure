name: Native release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64, runner: ubuntu-24.04, arch: x64, rust: x86_64-unknown-linux-gnu}
          - {target: linux-arm64, runner: ubuntu-24.04-arm, arch: arm64, rust: aarch64-unknown-linux-gnu}
          - {target: windows-x64, runner: windows-2025, arch: x64, rust: x86_64-pc-windows-msvc}
          - {target: windows-arm64, runner: windows-11-arm, arch: arm64, rust: aarch64-pc-windows-msvc}
          - {target: macos-arm64, runner: macos-15, arch: arm64, rust: aarch64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: .temp/target
      RIG_RELEASE_TARGET: ${{ matrix.target }}
      RIG_RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake pkg-config ubuntu-keyring
      - name: Prepare vcpkg and libclang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rig-vcpkg'
          git clone --depth 1 --branch 2026.04.27 https://github.com/microsoft/vcpkg.git $root
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clang = Split-Path (Get-Command clang.exe).Source
          if (!(Test-Path (Join-Path $clang 'libclang.dll'))) {
            throw "libclang.dll is missing under $clang"
          }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV
      - name: Prepare vcpkg and libclang on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          root="$RUNNER_TEMP/rig-vcpkg"
          git clone --depth 1 --branch 2026.04.27 https://github.com/microsoft/vcpkg.git "$root"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          clang="$(brew --prefix llvm@18)"
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$clang/lib" >> "$GITHUB_ENV"
      - name: Build and check packages
        shell: bash
        run: scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rig-edge-browser-${{ matrix.target }}
          path: |
            dist/*-${{ matrix.target }}-*.zip
            dist/*-${{ matrix.target }}-*.zip.sha256
            dist/rig-edge-browser-deps-${{ matrix.target }}-*.json
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rig-edge-browser-*
          path: dist
          merge-multiple: true
      - name: Publish all native packages and indexes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
